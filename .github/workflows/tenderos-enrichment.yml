name: TenderOS enrichment scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenderos-production-enrichment
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run complete TenderOS enrichment cycle
        env:
          TENDEROS_SCHEDULER_TOKEN: ${{ secrets.TENDEROS_SCHEDULER_TOKEN }}
          TENDEROS_RUN_URL: https://tenderos-staging.onrender.com/internal/enrichment/scheduled-run
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --max-time 840 \
              --connect-timeout 30 \
              --retry 2 \
              --retry-delay 20 \
              --retry-all-errors \
              --request POST \
              --header "X-TenderOS-Scheduler-Token: ${TENDEROS_SCHEDULER_TOKEN}" \
              "$TENDEROS_RUN_URL"
          )"

          cat "$response_file"

          if [ "$http_code" != "200" ]; then
            echo "TenderOS returned HTTP $http_code; expected 200 from a completed cycle."
            exit 1
          fi

          if ! grep -q '"status":"complete"' "$response_file"; then
            echo "TenderOS response did not confirm a completed cycle."
            exit 1
          fi

          echo "TenderOS enrichment completed successfully."
