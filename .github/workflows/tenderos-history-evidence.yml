name: TenderOS history evidence micro-worker

on:
  workflow_dispatch:
  push:
    branches:
      - feat/history-evidence-micro-worker
    paths:
      - ".github/workflows/tenderos-history-evidence.yml"

permissions:
  contents: read

concurrency:
  group: tenderos-history-evidence-micro-worker
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TENDEROS_SCHEDULER_TOKEN: ${{ secrets.TENDEROS_SCHEDULER_TOKEN }}
      TENDEROS_HISTORY_EVIDENCE_URL: https://tenderos-staging.onrender.com/internal/history/evidence-run

    steps:
      - name: Run one bounded history evidence pass
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --max-time 1500 \
              --connect-timeout 30 \
              --request POST \
              --header "X-TenderOS-Scheduler-Token: ${TENDEROS_SCHEDULER_TOKEN}" \
              "$TENDEROS_HISTORY_EVIDENCE_URL"
          )"

          cat "$response_file"
          echo

          if [ "$http_code" = "409" ]; then
            echo "Another authoritative TenderOS worker owns the DB lock; overlap is healthy."
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            echo "History evidence worker returned HTTP ${http_code}; expected 200."
            exit 1
          fi
          if ! grep -q '"status":"complete"' "$response_file"; then
            echo "History evidence response did not confirm status=complete."
            exit 1
          fi
          if ! grep -q '"mode":"history_evidence_micro"' "$response_file"; then
            echo "History evidence response did not confirm micro-worker mode."
            exit 1
          fi
